[pytest]
asyncio_mode = auto
pythonpath = . src
testpaths =
    src/lib/rag/tests
    src/agents/codesec/tests
    src/agents/orchestrator/tests
    src/agents/agentInfraCost/tests
    src/agents/deployops/test.py
    src/backend/tests
python_files = test_*.py
addopts = --ignore=src/backend/tests/test_ws.py